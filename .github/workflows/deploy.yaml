name: Build & Deploy Laravel (CI/CD)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Vite Assets
        working-directory: ElnusaPuspitaPratama
        run: |
          npm ci
          npm run build

      - name: Commit & Push Built Assets to GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f ElnusaPuspitaPratama/public/build
          if ! git diff --staged --quiet; then
            git commit -m "chore(build): update compiled Vite assets in /public/build [skip ci]"
            git push origin main
          else
            echo "No changes in /public/build to commit."
          fi

      - name: Upload Built Assets Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vite-build-assets
          path: ElnusaPuspitaPratama/public/build

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download Built Assets Artifact
        uses: actions/download-artifact@v4
        with:
          name: vite-build-assets
          path: ElnusaPuspitaPratama/public/build

      - name: Deploy Built Assets via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: "ElnusaPuspitaPratama/public/build"
          target: "/home/uccca-epp/htdocs/epp.uccca.site"

      - name: Execute Remote SSH Commands
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            # Navigate to Laravel root directory
            cd /home/uccca-epp/htdocs/epp.uccca.site/ElnusaPuspitaPratama

            # Enable maintenance mode
            php artisan down || true

            # Sync latest commits (including pushed /public/build) cleanly
            git fetch origin main
            git reset --hard origin/main

            # Install composer dependencies
            composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

            # Run migrations
            php artisan migrate --force

            # Optimize cache safely for TiDB SSL
            php artisan optimize:clear
            php artisan route:cache
            php artisan view:cache

            # Disable maintenance mode
            php artisan up
