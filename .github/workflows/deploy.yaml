name: Deploy Laravel to Shared Hosting (SSH)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Vite Assets
        working-directory: ElnusaPuspitaPratama
        run: |
          npm ci
          npm run build

      - name: Deploy Built Assets via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: "ElnusaPuspitaPratama/public/build"
          target: "/home/uccca-epp/htdocs/epp.uccca.site"

      - name: Execute Remote SSH Commands
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            # Navigate to Laravel root directory
            cd /home/uccca-epp/htdocs/epp.uccca.site/ElnusaPuspitaPratama

            # Enable maintenance mode
            php artisan down || true

            # Pull latest commits
            git pull origin main

            # Install composer dependencies
            composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

            # Run migrations
            php artisan migrate --force

            # Optimize cache for Laravel 12
            php artisan optimize:clear
            php artisan optimize

            # Disable maintenance mode
            php artisan up
